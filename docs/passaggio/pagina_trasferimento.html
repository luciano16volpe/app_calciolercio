<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalcioLercio si è trasferita</title>
<meta name="theme-color" content="#1a4a8f">
<style>
  :root{color-scheme:light dark;--bg:#eef1f6;--card:#fff;--text:#1b2230;--sub:#5b6678;--blue:#2f6fd6}
  @media(prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#1b2130;--text:#eef2f8;--sub:#a3adbd;--blue:#5aa9ff}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);padding:20px;box-sizing:border-box}
  .box{max-width:380px;width:100%;background:var(--card);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .ic{font-size:46px}
  h1{font-size:20px;margin:10px 0 8px}
  p{font-size:14px;line-height:1.45;color:var(--sub);margin:8px 0}
  a.btn{display:block;margin-top:16px;padding:14px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;text-decoration:none;font-size:15px}
  .small{font-size:12px}
</style>
</head>
<body>
<div class="box">
  <div class="ic">⚽</div>
  <h1>CalcioLercio si è trasferita!</h1>
  <p id="msg">Ti porto al nuovo indirizzo…</p>
  <a class="btn" id="go" href="https://luciano16volpe.github.io/app_calciolercio/">Apri CalcioLercio</a>
  <p class="small" id="hint" style="display:none">Se avevi l'app sulla schermata Home: aprila dal nuovo indirizzo e aggiungila di nuovo (Condividi → «Aggiungi alla schermata Home»), poi elimina la vecchia icona.</p>
</div>
<script>
  // NEW_URL: the new address of the app (keep the same in the link above)
  var NEW_URL='https://luciano16volpe.github.io/app_calciolercio/';
  var go=document.getElementById('go'); go.href=NEW_URL+location.search+location.hash;
  var standalone=window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(standalone){
    // opened from the old Home-screen icon: explain how to re-add it, no automatic jump
    document.getElementById('msg').textContent='L’app ha un nuovo indirizzo.';
    document.getElementById('hint').style.display='block';
  }else{
    setTimeout(function(){ location.replace(go.href); }, 1200);
  }
</script>
</body>
</html>
